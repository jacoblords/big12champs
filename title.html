<meta charset="utf-8">
<title>Title Weekend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Title weekend: every league's championship game on one page. The league pages' sheet (tokens,
   type, header), with each game as a poster in its two teams' colors. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --sunk: #e9ebf0; --ink: #141820; --muted: #5d6576; --line: #d9dde5;
  --accent: #1c48c9; --accent-soft: #e3e9fb; --win: #11795a; --win-soft: #dcf1e9; --loss: #b8322a; --gold: #b07d12; --gold-soft: #f8eed6;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1016; --surface: #151a22; --sunk: #1c222c; --ink: #e7eaf0; --muted: #97a0b1; --line: #29303c;
    --accent: #85a6ff; --accent-soft: #1d2846; --win: #44c99a; --win-soft: #13302a; --loss: #ff8173; --gold: #e8bb55; --gold-soft: #33290f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1016; --surface: #151a22; --sunk: #1c222c; --ink: #e7eaf0; --muted: #97a0b1; --line: #29303c;
  --accent: #85a6ff; --accent-soft: #1d2846; --win: #44c99a; --win-soft: #13302a; --loss: #ff8173; --gold: #e8bb55; --gold-soft: #33290f; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo-light { display: none; }
  :root:not([data-theme="light"]) .logo-dark { display: inline; }
}
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: inline; }
html { scrollbar-gutter: stable; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap[aria-busy="true"] { visibility: hidden; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: 0.01em; line-height: 1.05; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.85rem; color: var(--muted); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rk { font-family: var(--display); font-weight: 600; font-size: 0.78em; opacity: 0.8; margin-right: 0.3em; font-variant-numeric: tabular-nums; }

/* header: the league pages' quiet strip, each league's link going to its gameday page */
.top { padding-block: 28px 18px; display: grid; gap: 8px; }
.top h1 { font-size: clamp(2.6rem, 7vw, 4.2rem); text-transform: uppercase; font-weight: 800; }
.top p { margin: 0; max-width: 70ch; color: var(--muted); }
.topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 18px; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.leagues { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.leagues a { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); text-decoration: none; font-family: var(--display); font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; }
.leagues a:hover { color: var(--ink); }
.leagues a img { height: 18px; width: auto; max-width: 30px; object-fit: contain; }
@media (max-width: 440px) { .leagues { column-gap: 12px; } .leagues a { gap: 5px; letter-spacing: 0.04em; } }
@media (max-width: 359px) { .leagues { column-gap: 10px; } .leagues a { gap: 4px; font-size: 0.85rem; } .leagues a img { height: 16px; max-width: 26px; } }
/* the five conference logos lead the headline */
.titlerow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.marks { display: flex; align-items: center; gap: 12px; padding-right: 18px; border-right: 3px solid var(--ink); align-self: stretch; }
.marks img { height: clamp(26px, 5vw, 40px); width: auto; max-width: 64px; object-fit: contain; }
@media (max-width: 560px) { .marks { border-right: 0; padding-right: 0; order: 2; } }

/* the weekend at a glance: every kickoff, by day */
.sched { display: grid; gap: 10px; padding-bottom: 22px; }
.day { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 8px 12px; align-items: start; }
.day h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-top: 10px; }
.day .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
@media (max-width: 560px) { .day { grid-template-columns: minmax(0, 1fr); } .day h2 { padding-top: 0; } }
.slot { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); text-decoration: none; transition: border-color .15s; }
.slot:hover { border-color: var(--muted); }
.slot > img { width: 26px; height: 26px; object-fit: contain; }
.slot .m { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.04em; min-width: 0; white-space: nowrap; overflow: hidden; }
.slot .m img { width: 18px; height: 18px; object-fit: contain; }
.slot .m .v { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
.slot .m .lost { opacity: 0.5; }
.slot .w { font-size: 0.8rem; color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.slot .w.live { color: var(--loss); font-weight: 600; }
.dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--loss); vertical-align: 1px; animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 0.25; } to { opacity: 1; } }

/* champions, as each game goes final */
.champs { display: grid; gap: 10px; padding: 16px 18px; margin-bottom: 22px; border-radius: 14px; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.champs h2 { font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); }
.champs .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.champ { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 6px 10px; border-radius: 10px; background: var(--surface); color: var(--ink); text-decoration: none; }
.champ img.t { grid-row: span 2; width: 40px; height: 40px; object-fit: contain; }
.champ b { font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.03em; line-height: 1; }
.champ span { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.champ.tbd { background: transparent; border: 1px dashed color-mix(in srgb, var(--gold) 45%, transparent); }
.champ.tbd .t { opacity: 0.35; filter: grayscale(1); }

/* a title game: a poster in the two teams' colors, then the details on the page's own surface */
.games { display: grid; gap: 28px; padding-bottom: 10px; }
.tg { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; scroll-margin-top: 16px; }
.band { position: relative; display: grid; gap: 14px; padding: 16px 20px 20px; color: #fff;
  background: linear-gradient(100deg, var(--ca) 0 calc(50% - 1px), rgb(255 255 255 / 0.85) calc(50% - 1px) calc(50% + 1px), var(--cb) calc(50% + 1px) 100%); }
/* a soft shade over both halves so white type and the league mark read on any team color */
.band::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0.28), rgb(0 0 0 / 0.05) 45%, rgb(0 0 0 / 0.3)); pointer-events: none; }
.band > * { position: relative; }
.band.tbd { --ca: #39414f; --cb: #39414f; background: linear-gradient(100deg, #2b3240, #4a5365); }
.bhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; }
.lgm { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lgm .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 4px 9px; background: #fff; border-radius: 8px; flex: none; }
.lgm .chip img { height: 24px; width: auto; max-width: 56px; object-fit: contain; }
.lgm h2 { font-size: clamp(1.15rem, 3vw, 1.45rem); text-transform: uppercase; letter-spacing: 0.05em; text-shadow: 0 1px 2px rgb(0 0 0 / 0.35); }
.bwhen { font-size: 0.85rem; font-weight: 600; text-shadow: 0 1px 2px rgb(0 0 0 / 0.4); font-variant-numeric: tabular-nums; text-align: right; }
.bwhen .live { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; background: rgb(0 0 0 / 0.45); }
.bwhen .live .dot { background: #ff6b5e; }
.match { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
.side { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; align-content: center; min-width: 0; }
.side .disk { grid-column: 1; grid-row: 1 / span 2; }
.side .nm, .side .sub { grid-column: 2; align-self: end; }
.side .sub { align-self: start; }
.side.b { grid-template-columns: minmax(0, 1fr) auto; text-align: right; }
.side.b .disk { grid-column: 2; }
.side.b .nm, .side.b .sub { grid-column: 1; }
.disk { width: clamp(64px, 13vw, 96px); height: clamp(64px, 13vw, 96px); border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 4px 14px rgb(0 0 0 / 0.3); }
.disk img { width: 70%; height: 70%; object-fit: contain; }
.side .nm { font-family: var(--display); font-weight: 800; font-size: clamp(1.4rem, 4.4vw, 2.3rem); line-height: 0.95; text-transform: uppercase; text-shadow: 0 1px 3px rgb(0 0 0 / 0.4); overflow-wrap: anywhere; }
.side .sub { font-size: 0.82rem; font-weight: 500; opacity: 0.92; text-shadow: 0 1px 2px rgb(0 0 0 / 0.4); font-variant-numeric: tabular-nums; }
.seed { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; padding: 0 7px; border-radius: 4px; background: rgb(0 0 0 / 0.4); margin-right: 6px; vertical-align: 2px; }
.mid { display: grid; justify-items: center; gap: 2px; min-width: 3.5em; text-shadow: 0 1px 3px rgb(0 0 0 / 0.45); }
.mid .vs { font-family: var(--display); font-weight: 700; font-size: 1.2rem; letter-spacing: 0.1em; opacity: 0.9; }
.mid .sc { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 7vw, 3.4rem); line-height: 0.9; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mid .sc .lo { opacity: 0.6; }
.side.lost { opacity: 0.6; }
.crown { justify-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 999px; background: #fff; color: #141820; font-family: var(--display); font-weight: 700; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase; box-shadow: 0 3px 10px rgb(0 0 0 / 0.25); }
.crown svg { width: 18px; height: 18px; fill: #c99413; }
@media (max-width: 600px) {
  .band { padding: 14px 14px 16px; }
  .match { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; }
  .side, .side.b { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .side .disk, .side.b .disk, .side .nm, .side.b .nm, .side .sub, .side.b .sub { grid-column: 1; grid-row: auto; align-self: center; }
  .side .sub { font-size: 0.75rem; }
}
/* what the band doesn't hold */
.body { display: grid; gap: 18px; padding: 16px 20px 18px; }
@media (max-width: 600px) { .body { padding: 14px; } }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.85rem; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
/* ESPN's odds of winning, as one bar split in the two colors */
.odds { display: grid; gap: 4px; }
.odds .lab { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.odds .lab b { color: var(--ink); font-weight: 600; }
.odds .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunk); }
.odds .bar i { display: block; height: 100%; }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px 24px; align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.blk { display: grid; gap: 8px; align-content: start; min-width: 0; }
.blk h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
/* tale of the tape: the two teams' numbers either side of what they measure, the better one marked */
.tape { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.tape > span { padding: 5px 4px; border-bottom: 1px solid var(--line); }
.tape .k { text-align: center; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; padding-inline: 10px; align-self: stretch; display: grid; align-items: center; }
.tape .a { text-align: left; }
.tape .b { text-align: right; }
.tape .hd { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.04em; border-bottom: 2px solid var(--line); display: flex; align-items: center; gap: 6px; }
.tape .hd.b { justify-content: flex-end; }
.tape .hd img { width: 20px; height: 20px; object-fit: contain; }
.tape .up { font-weight: 700; }
.tape .up::after { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 6px; border-radius: 50%; background: var(--team); vertical-align: 2px; }
.tape .b.up::after { display: none; }
.tape .b.up::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 6px; border-radius: 50%; background: var(--team); vertical-align: 2px; }
/* last five, oldest first */
.form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.form .f { display: flex; gap: 3px; flex-wrap: wrap; }
.form .f.b { justify-content: flex-end; }
.r { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; font-family: var(--display); font-weight: 700; font-size: 0.85rem; cursor: default; }
.r.W { background: var(--win-soft); color: var(--win); }
.r.L { background: color-mix(in srgb, var(--loss) 14%, var(--surface)); color: var(--loss); }
.meet { margin: 0; font-size: 0.9rem; }
.meet b { font-weight: 600; }
.common { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 0; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.common > span { padding: 3px 4px; border-bottom: 1px dotted var(--line); }
.common .o { text-align: center; font-family: var(--display); font-weight: 600; letter-spacing: 0.04em; color: var(--muted); padding-inline: 10px; }
.common .b { text-align: right; }
.common .W { color: var(--win); font-weight: 600; }
.common .L { color: var(--loss); }
.note { margin: 0; font-size: 0.82rem; color: var(--muted); }
/* players to watch: ESPN's season leaders, each team's three */
.lead { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.lead ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lead li { display: grid; gap: 0; font-size: 0.85rem; padding-left: 9px; border-left: 3px solid var(--team); }
.lead li b { font-weight: 600; }
.lead li span { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.lead .c { font-family: var(--display); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
@media (max-width: 480px) { .lead { grid-template-columns: minmax(0, 1fr); } }
.links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.85rem; border-top: 1px solid var(--line); padding-top: 12px; }
/* the matchup still to be set: who's still in it */
.run { display: flex; flex-wrap: wrap; gap: 8px; }
.run a { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; background: var(--sunk); border-radius: 999px; color: var(--ink); text-decoration: none; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
.run a img { width: 22px; height: 22px; object-fit: contain; }
.run a b { font-family: var(--display); font-weight: 700; letter-spacing: 0.04em; font-size: 1rem; }
.band .tbdq { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.4rem); text-transform: uppercase; text-align: center; padding-block: 10px 4px; opacity: 0.9; }
/* in-game win probability, as on the gameday pages */
.wp { display: grid; gap: 2px; }
.wp-lab { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.wp-lab b { color: var(--ink); font-weight: 600; }
.wp svg { display: block; width: 100%; height: 90px; border-block: 1px dotted var(--line); }
.wp .q { stroke: var(--line); stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
.wp .m { stroke: var(--muted); vector-effect: non-scaling-stroke; }
.wp .f { opacity: 0.3; }
.wp .l { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.wp-plot { position: relative; cursor: crosshair; touch-action: pan-y; }
.wp-hl { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--ink); pointer-events: none; }
.wp-t { position: absolute; top: -2px; transform: translate(-50%, -100%); background: var(--ink); color: var(--surface); font-size: 0.68rem; font-weight: 600; padding: 1px 6px; border-radius: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.wp-q { position: relative; height: 1.2em; font-size: 0.68rem; color: var(--muted); }
.wp-q span { position: absolute; transform: translateX(-50%); }
footer { padding-block: 30px 40px; font-size: 0.85rem; color: var(--muted); display: grid; gap: 6px; }
/* the team with the ball, in a game under way */
.ball { display: inline-block; width: 1.15em; height: 0.75em; margin-left: 0.4em; vertical-align: -0.05em; flex: none; }
.side .nm .ball { width: 0.62em; height: 0.4em; vertical-align: 0.15em; margin-left: 0.25em; }
.slot .m .ball { margin-left: 0.25em; }
</style>

<div class="wrap" id="page" aria-busy="true">
  <header class="top">
    <div class="topbar"><nav class="leagues" id="leagues" aria-label="League gameday pages"></nav></div>
    <span class="eyebrow" id="season"></span>
    <div class="titlerow"><div class="marks" id="marks" aria-hidden="true"></div><h1>Title Weekend</h1></div>
    <p id="lede"></p>
  </header>
  <section class="champs" id="champs" aria-labelledby="champs-h" hidden></section>
  <nav class="sched" id="sched" aria-label="The weekend's kickoffs"></nav>
  <main class="games" id="games"></main>
  <footer id="foot"></footer>
</div>

<script>
"use strict";
// the live-scores worker (trigger/worker.mjs), from the LIVE_URL build setting; "" means none
const LIVE_URL = /*__LIVE__*/"";
const $ = (id) => document.getElementById(id);
// The team with the ball in a game under way: a small football by its name (ESPN's summary, via
// the live-scores worker). Outlined in white so it reads on a team color too.
const BALL = `<svg class="ball" viewBox="0 0 22 14" role="img" aria-label="Has the ball"><title>Has the ball</title><ellipse cx="11" cy="7" rx="10" ry="6" fill="#8a4b22" stroke="#fff" stroke-width="1.2"/><path d="M7 7h8M9 5.4v3.2M11 5.4v3.2M13 5.4v3.2" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/></svg>`;
const isPossession = (v) => v == null || (typeof v === "string" && /^\d{1,12}$/.test(v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const safeColor = (c) => (/^#[0-9a-fA-F]{6}$/.test(c || "") ? c : /^#[0-9a-fA-F]{3}$/.test(c || "") ? "#" + c.slice(1).replace(/./g, "$&$&") : "#666666");
// logos: files the build wrote under logos/, or inlined; nothing else is rendered
const isPng = (u) => /^(data:image\/png;base64,[A-Za-z0-9+/=]+|(\.\.\/)*logos\/[0-9a-f]{16}\.png)$/.test(u || "");
const img = (u, cls) => (isPng(u) ? `<img${cls ? ` class="${cls}"` : ""} src="${u}" alt="">` : "");
const themed = (x) => (!isPng(x.logo) ? "" : !isPng(x.logoDark) ? img(x.logo) : img(x.logo, "logo-light") + img(x.logoDark, "logo-dark"));
function pct(p) {
  if (p == null) return "–";

    // the line is B's odds from the top, so A's area sits above the middle
    return `<div class="wp" role="img" aria-label="ESPN win probability: ${esc(A.abbr)} ${winPct(1 - pB, final)}, ${esc(B.abbr)} ${winPct(pB, final)}">
      ${lab(A, 1 - pB)}<div class="wp-plot" data-gid="${esc(g.id)}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><clipPath id="${id}a"><rect x="0" y="0" width="${W}" height="${mid}"/></clipPath><clipPath id="${id}h"><rect x="0" y="${mid}" width="${W}" height="${mid}"/></clipPath></defs>
      ${quarters}<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" class="m"/>
      <polygon points="${area}" fill="${ca}" clip-path="url(#${id}a)" class="f"/><polygon points="${area}" fill="${cb}" clip-path="url(#${id}h)" class="f"/>
      <polyline points="${line}" class="l"/></svg><div class="wp-hl" hidden><span class="wp-t"></span></div></div>
      <div class="wp-q" aria-hidden="true">${labels}</div>${lab(B, pB)}</div>`;
  }

  $("foot").innerHTML = `<span>Schedules, lines, win odds, season leaders and live win probability from ESPN; CFP rankings from the committee's latest Top 25. Updated ${esc(new Date(DATA.fetchedAt).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}.</span>
    <span>Every league's race, paths and tiebreakers: <a href="${up}">Big 12</a>, ${DATA.leagues.filter((l) => l.path).map((l) => `<a href="${up + l.path}">${esc(l.name)}</a>`).join(", ")}.</span>`;
  return { liveIds: () => L.map((l) => l.title).filter(underWay).map((g) => g.id) };
}

// hover (or drag a finger) along a chart: the clock at that moment and both teams' odds then
const wpData = new Map();
function gameClock(t) {
  if (t >= 3600) return "OT";
  const q = Math.floor(t / 900), left = 900 - (t % 900);
  return `${["1st", "2nd", "3rd", "4th"][q]} ${Math.floor(left / 60)}:${String(Math.round(left % 60)).padStart(2, "0")}`;
}
function readWp(plot, clientX) {
  const d = wpData.get(plot.dataset.gid), box = plot.closest(".wp");
  if (!d || !box) return;
  const r = plot.getBoundingClientRect(), f = Math.min(Math.max((clientX - r.left) / r.width, 0), 1);
  const t = f * d.tMax, pts = d.pts, last = pts.length - 1;
  if (t > pts[last][0]) return leaveWp(plot);
  let lo = 0, hi = last;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (pts[m][0] <= t) lo = m; else hi = m - 1; }
  const pB = (d.flip ? 1000 - pts[lo][1] : pts[lo][1]) / 1000, final = d.final && lo === last;
  const hl = plot.querySelector(".wp-hl");
  hl.hidden = false;
  hl.style.left = `${((pts[lo][0] / d.tMax) * 100).toFixed(2)}%`;
  hl.querySelector(".wp-t").textContent = final ? "Final" : gameClock(pts[lo][0]);
  const [top, bottom] = box.querySelectorAll(".wp-lab b");
  top.textContent = winPct(1 - pB, final); bottom.textContent = winPct(pB, final);
}
function leaveWp(plot) {
  const hl = plot.querySelector(".wp-hl"), box = plot.closest(".wp");
  if (hl) hl.hidden = true;
  if (box) for (const b of box.querySelectorAll(".wp-lab b")) b.textContent = b.dataset.now;
}
const wpPlot = (el) => (el && el.closest ? el.closest(".wp-plot") : null);
document.addEventListener("pointermove", (e) => { const p = wpPlot(e.target); if (p) readWp(p, e.clientX); });
document.addEventListener("pointerdown", (e) => { const p = wpPlot(e.target); if (p) readWp(p, e.clientX); });
document.addEventListener("pointerout", (e) => { const p = wpPlot(e.target); if (p && wpPlot(e.relatedTarget) !== p) leaveWp(p); });

// Load, show, then follow along while the page is on screen: page-data.json every minute (a new
// build: results, lines, a matchup set), and the live worker every 30 seconds while a title game is
// under way (scores, clocks, win-probability charts), as the gameday pages do.
const getData = () => fetch("page-data.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
const stamp = (d) => d.fetchedAt + "|" + d.leagues.map((l) => (l.title ? l.title.id + ":" + ((l.title.wp || {}).pts || []).length : "")).join(",");
let DATA = null, view = null, shown = null, lastLive = {};
const isWp = (w) => !!w && typeof w === "object" && Array.isArray(w.pts) && w.pts.length <= 500
  && w.pts.every((p) => Array.isArray(p) && p.length === 2 && p.every(Number.isFinite))
  && ["homeScore", "awayScore"].every((k) => w[k] === null || Number.isInteger(w[k]))
  && (w.detail === null || typeof w.detail === "string") && typeof w.final === "boolean"
  && (w.state == null || ["pre", "in", "post"].includes(w.state)) && isPossession(w.possession);
function applyLive(d, byId) {
  for (const l of d.leagues) {
    const g = l.title, w = g && byId[g.id];
    if (!isWp(w) || g.completed || (g.wp && (g.wp.final || g.wp.pts.length > w.pts.length))) continue;
    g.wp = w;
  }
}
function draw(d) {
  applyLive(d, lastLive);
  DATA = d; view = app(d);
}
function every(ms, job, now) {
  let timer = null, busy = false, last = 0;
  const schedule = () => { clearTimeout(timer); timer = document.hidden ? null : setTimeout(run, ms); };
  function run() {
    timer = null;
    if (document.hidden || busy) return;
    busy = true; last = Date.now();
    Promise.resolve().then(job).catch(() => {}).finally(() => { busy = false; schedule(); });
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearTimeout(timer); timer = null; } else if (!busy) (Date.now() - last >= ms ? run() : schedule());
  });
  if (now) run(); else { last = Date.now(); schedule(); }
}
// shown once whole (fonts in, capped), then at the game the link names (the gameday pages' Title
// games button links to its league's): the cards didn't exist when the browser looked for it
function reveal() {
  const show = () => {
    $("page").removeAttribute("aria-busy");
    const to = /^#[a-z0-9]+$/.test(location.hash) ? document.getElementById(location.hash.slice(1)) : null;
    if (to) to.scrollIntoView({ behavior: "instant" });
  };
  Promise.race([document.fonts ? document.fonts.ready : null, new Promise((r) => setTimeout(r, 500))].filter(Boolean)).then(show, show);
}
getData()
  .then((d) => {
    shown = stamp(d); draw(d);
  })
  .catch((e) => { $("lede").textContent = `Couldn't load the title games (${e.message}). Reload the page to try again.`; })
  .finally(() => {
    reveal();
    if (!shown) return;
    every(60e3, () => getData().then((d) => { if (stamp(d) !== shown) { shown = stamp(d); draw(d); } }));
    if (LIVE_URL) every(30e3, () => {
      const ids = view ? view.liveIds() : [];
      if (!ids.length) return;
      return fetch(`${LIVE_URL}live?ids=${ids.join(",")}`, { cache: "no-store" })
        .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then((m) => { lastLive = m; draw(DATA); });
    }, true);
  });
</script>
