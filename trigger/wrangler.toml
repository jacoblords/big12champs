# Cloudflare Worker that starts update.yml on time and serves the gameday pages' live scores.
# See trigger/README.md.
name = "titlepaths-trigger"
main = "worker.mjs"
compatibility_date = "2026-11-01"

# HTTP: GET /live on the workers.dev address (titlepaths.com's DNS isn't on Cloudflare).
workers_dev = true
preview_urls = false

[vars]
REPO = "jacoblords/big12champs"
WORKFLOW = "update.yml"
REF = "main"
# pages allowed to read /live from a browser (localhost is allowed too, for local builds)
ORIGINS = "https://titlepaths.com,https://www.titlepaths.com"

# UTC, like GitHub's. Every 15 minutes Thursday through Sunday (Thursday evening through late
# Saturday night in US time) and every 30 minutes Monday to Wednesday. A run with nothing due
# makes no ESPN calls and deploys nothing, so the cadence costs ESPN nothing extra.
[triggers]
crons = ["*/15 * * * THU,FRI,SAT,SUN", "*/30 * * * MON,TUE,WED"]

[observability]
enabled = true

# The shared copy of each live game: one instance, so ESPN is asked once per game per 30s
# however many people are watching. SQLite-backed, which the free plan includes.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveCache"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveCache"]
