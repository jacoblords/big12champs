name: Update data and deploy

# Runs every 15 minutes Thursday through Sunday (UTC, which covers Thursday evening
# through late Saturday night in US time) and every 30 minutes Monday-Wednesday.
# fetch_data.py only calls ESPN when something can have changed (a game passed
# kickoff + 3h, the daily schedule check, the 6-hourly FPI check), so a run with
# nothing due makes no ESPN calls and deploys nothing. When data changes, exact.js
# re-enumerates every finish (about a minute) before the deploy.
# Minutes are offset from :00 because GitHub delays scheduled jobs most at the top of the hour.
on:
  schedule:
    - cron: "7,22,37,52 * * * 0,4,5,6"
    - cron: "7,37 * * * 1,2,3"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4  # exact.js
        with:
          node-version: "22"
      - id: fetch
        env:
          # exact.js skips (and the page uses simulation) when enumerating would take longer
          EXACT_BUDGET_SECONDS: "180"
        run: >
          python fetch_data.py
          --prev "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json"
          --site site --artifact ''
          ${{ github.event_name != 'schedule' && '--force-build' || '' }}
          --github-output
      - if: steps.fetch.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
