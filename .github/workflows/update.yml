name: Update data and deploy

# Runs every 15 minutes Thursday through Sunday (UTC, which covers Thursday evening
# through late Saturday night in US time) and every 30 minutes Monday-Wednesday, started by
# the Cloudflare Worker in trigger/ with force=false. GitHub's own schedule fires only every
# few hours for this repo, so it is kept hourly as a backup in case the worker stops.
# fetch_data.py only calls ESPN when something can have changed (a game passed
# kickoff + 3h, the daily schedule check, the 6-hourly FPI check), so a run with
# nothing due makes no ESPN calls and deploys nothing. When data changes, exact.js
# re-enumerates every finish (about a minute) before the deploy.
# Minutes are offset from :00 because GitHub delays scheduled jobs most at the top of the hour.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and deploy even if no data changed
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.big12.outputs.changed == 'true' || steps.sec.outputs.changed == 'true' || steps.acc.outputs.changed == 'true' || steps.big10.outputs.changed == 'true' }}
    env:
      # exact.js skips (and the page uses simulation) when enumerating would take longer
      EXACT_BUDGET_SECONDS: "180"
      PUBLISHED: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # Pushes and "Run workflow" clicks rebuild; schedules and the trigger worker
      # (force=false) deploy only on changed data. Dispatch inputs arrive as strings.
      FORCE: ${{ github.event_name != 'schedule' && github.event.inputs.force != 'false' && '--force-build' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4  # exact.js
        with:
          node-version: "22"
      # One step per league, each starting from its own published data. Every step writes its
      # page into site/ whether or not it changed, so one deploy carries all of them.
      - id: big12
        run: python fetch_data.py --league big12 --prev "$PUBLISHED/data.json" --site site --artifact '' $FORCE --github-output
      - id: sec
        run: python fetch_data.py --league sec --prev "$PUBLISHED/sec/data.json" --site site --artifact '' $FORCE --github-output
      - id: acc
        run: python fetch_data.py --league acc --prev "$PUBLISHED/acc/data.json" --site site --artifact '' $FORCE --github-output
      - id: big10
        run: python fetch_data.py --league big10 --prev "$PUBLISHED/big10/data.json" --site site --artifact '' $FORCE --github-output
      - if: steps.big12.outputs.changed == 'true' || steps.sec.outputs.changed == 'true' || steps.acc.outputs.changed == 'true' || steps.big10.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
