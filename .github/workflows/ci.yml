name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine, exact solver and page tests
        run: node --test tests/*.test.js

      - name: Fetcher tests (fake ESPN, no network)
        run: python -m unittest discover -s tests -v

      - name: Build the site offline from the fixtures, exact odds included
        env:
          # CI checks that exact odds are correct, not how fast this runner is; the
          # production budget lives in update.yml.
          EXACT_BUDGET_SECONDS: "900"
        run: |
          python fetch_data.py --league big12 --offline --force-build --prev tests/fixtures/season-2026-11-09.json \
            --data-out "$RUNNER_TEMP/data.json" --site site --artifact ''
          python fetch_data.py --league sec --offline --force-build --prev tests/fixtures/sec-season-2026-11-09.json \
            --data-out "$RUNNER_TEMP/data-sec.json" --site site --artifact ''
          python fetch_data.py --league acc --offline --force-build --prev tests/fixtures/acc-season-2026-11-09.json \
            --data-out "$RUNNER_TEMP/data-acc.json" --site site --artifact ''
          # The Big Ten snapshot has 27 conference games left (134 million finishes): over the
          # production budget, so it builds the way production does, with simulated odds.
          EXACT_BUDGET_SECONDS=180 python fetch_data.py --league big10 --offline --force-build \
            --prev tests/fixtures/big10-season-2026-11-10.json --data-out "$RUNNER_TEMP/data-big10.json" --site site --artifact ''

      - name: Built pages parse and carry exact odds
        run: |
          node -e '
            const fs = require("fs"), vm = require("vm");
            for (const dir of ["site", "site/sec", "site/acc", "site/big10"]) {
              const html = fs.readFileSync(dir + "/index.html", "utf8");
              const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
              if (scripts.length !== 2) throw new Error(dir + ": expected 2 scripts, found " + scripts.length);
              scripts.forEach((s) => new vm.Script(s));
              const d = JSON.parse(fs.readFileSync(dir + "/data.json", "utf8"));
              // the page loads page-data.json: data.json with each team logo as a file that exists
              const pd = JSON.parse(fs.readFileSync(dir + "/page-data.json", "utf8"));
              if (pd.teams.length !== d.teams.length) throw new Error(dir + ": page-data.json teams differ");
              for (const t of pd.teams) for (const u of [t.logo, t.logoDark]) {
                if (u == null) continue;
                if (!/^(\.\.\/)*logos\/[0-9a-f]{16}\.png$/.test(u)) throw new Error(dir + ": team logo not a file: " + u.slice(0, 40));
                if (!fs.existsSync(dir + "/" + u)) throw new Error(dir + ": missing " + u);
              }
              // each league has a gameday page: the same template with GAMEDAY on, its own data copy one level down
              const gd = fs.readFileSync(dir + "/gameday/index.html", "utf8");
              const gdScripts = [...gd.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
              if (gdScripts.length !== 2 || !gdScripts[1].includes("const GAMEDAY = true;")) throw new Error(dir + ": gameday page not built as one");
              gdScripts.forEach((s) => new vm.Script(s));
              const gpd = JSON.parse(fs.readFileSync(dir + "/gameday/page-data.json", "utf8"));
              for (const t of gpd.teams) for (const u of [t.logo, t.logoDark]) {
                if (u != null && !fs.existsSync(dir + "/gameday/" + u)) throw new Error(dir + ": gameday page missing " + u);
              }
              if (dir === "site/big10") {
                if (!d.exact || !/over the 180s budget/.test(d.exact.skipped || "")) throw new Error(dir + ": expected simulated odds, got " + JSON.stringify(d.exact));
                // ...with the no-what-ifs view precomputed for every team
                if (!d.sim || d.sim.key !== d.exact.key || d.sim.teams.length !== d.teams.length || !d.sim.totals.cond) throw new Error(dir + ": simulated view not precomputed");
                console.log("ok:", dir, "simulated:", d.exact.skipped, "precomputed for", d.sim.teams.length, "teams");
                continue;
              }
              if (!d.exact || d.exact.skipped || d.exact.teams.length !== d.teams.length) throw new Error(dir + ": exact odds missing");
              if (d.sim) throw new Error(dir + ": exact odds carry no simulated view");
              const total = d.exact.teams.reduce((s, t) => s + t.p, 0);
              if (Math.abs(total - 2) > 1e-9) throw new Error(dir + ": title-game odds sum to " + total);
              console.log("ok:", dir, d.exact.finishes, "finishes");
            }
          '
