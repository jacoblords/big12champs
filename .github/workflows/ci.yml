name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine, exact solver and page tests
        run: node --test tests/*.test.js

      - name: Fetcher tests (fake ESPN, no network)
        run: python -m unittest discover -s tests -v

      - name: Build the site offline from the fixture, exact odds included
        run: >
          python fetch_data.py --offline --force-build
          --prev tests/fixtures/season-2026-11-09.json
          --data-out "$RUNNER_TEMP/data.json" --site site --artifact ''

      - name: Built page parses and carries exact odds
        run: |
          node -e '
            const fs = require("fs"), vm = require("vm");
            const html = fs.readFileSync("site/index.html", "utf8");
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
            if (scripts.length !== 2) throw new Error("expected 2 scripts, found " + scripts.length);
            scripts.forEach((s) => new vm.Script(s));
            const d = JSON.parse(fs.readFileSync("site/data.json", "utf8"));
            if (!d.exact || d.exact.skipped || d.exact.teams.length !== d.teams.length) throw new Error("exact odds missing");
            const total = d.exact.teams.reduce((s, t) => s + t.p, 0);
            if (Math.abs(total - 2) > 1e-9) throw new Error("title-game odds sum to " + total);
            console.log("ok:", d.exact.finishes, "finishes");
          '
