<meta charset="utf-8">
<title>Title Paths</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: press-box sheet. Team picker strip on top, selected team's path + rooting guide side by side, method and rulebook below. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --sunk: #e9ebf0;
  --ink: #141820;
  --muted: #5d6576;
  --line: #d9dde5;
  --accent: #1c48c9;
  --accent-soft: #e3e9fb;
  --bar: #c4d3f8; /* odds fill on picker cards: clearly darker than the track (--sunk) */
  --bar-ink: #4f5767; /* odds-pill text: 4.5:1 or better over both the fill and the track (WCAG AA) */
  --win: #11795a;
  --win-soft: #dcf1e9;
  --loss: #b8322a;
  --loss-soft: #f8e1df;
  --warn: #865b0e; /* 4.5:1 or better on --sunk (upset odds) and --warn-soft (tags) */
  --warn-soft: #f6ecd6;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1016; --surface: #151a22; --sunk: #1c222c; --ink: #e7eaf0; --muted: #97a0b1; --line: #29303c;
    --accent: #85a6ff; --accent-soft: #1d2846; --bar: #2b3f78; --win: #44c99a; --win-soft: #13302a; --loss: #ff8173; --loss-soft: #3a1c1b;
    --warn: #e2b553; --warn-soft: #362a12; --bar-ink: #97a0b1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1016; --surface: #151a22; --sunk: #1c222c; --ink: #e7eaf0; --muted: #97a0b1; --line: #29303c;
  --accent: #85a6ff; --accent-soft: #1d2846; --bar: #2b3f78; --win: #44c99a; --win-soft: #13302a; --loss: #ff8173; --loss-soft: #3a1c1b;
  --warn: #e2b553; --warn-soft: #362a12; --bar-ink: #97a0b1; color-scheme: dark;
}
* { box-sizing: border-box; }
/* The page hides things with the hidden attribute; keep that working over display rules like .locks { display: flex }.
   (Claude's artifact viewer adds this reset itself; the standalone site needs its own.) */
[hidden] { display: none !important; }
img { max-width: 100%; }
/* dark-background team logos: swap with the theme (system setting or explicit data-theme) */
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo-light { display: none; }
  :root:not([data-theme="light"]) .logo-dark { display: inline; }
}
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: inline; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* Layout shift (CLS): the page is an empty shell until data.json arrives and fills it in, which moved
   everything already on screen. It stays invisible (still laid out, so its fonts load) until the first
   full render. The reserved gutter keeps a scrollbar appearing from nudging the centered column. */
html { scrollbar-gutter: stable; }
.wrap[aria-busy="true"] { visibility: hidden; }
/* odds being recomputed after a pick: dim the stale numbers, but only if it takes a moment */
#picker[aria-busy="true"], #team[aria-busy="true"] { opacity: 0.55; cursor: progress; transition: opacity 0.15s 0.12s; }
/* what is computing: a small pill fixed at the bottom of the screen, so it shows wherever the
   visitor clicked (the rooting guide is far below the picker on a phone) and never moves the page.
   Faded in after a beat so a quick update doesn't flash it. */
.calc { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 6px); z-index: 10; margin: 0;
  max-width: calc(100vw - 32px); padding: 7px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); font-size: 0.82rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s; }
.calc.on { opacity: 1; transform: translate(-50%, 0); transition-delay: 0.25s; }
.calc.on::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--accent); vertical-align: 1px; animation: calcpulse 1s ease-in-out infinite alternate; }
@keyframes calcpulse { from { opacity: 0.25; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .calc.on::before { animation: none; } }
/* estimated while the full run is out: same size, quieter */
.pick .odds.est b, .big .pct.est { color: var(--muted); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: 0.01em; line-height: 1.05; margin: 0; text-wrap: balance; }
h2 { font-size: 1.7rem; text-transform: uppercase; }
h3 { font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.04em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.85rem; color: var(--muted); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* segmented controls clip their children (overflow: hidden), so their focus ring goes inside */
.seg button:focus-visible, .rg-sort button:focus-visible { outline-offset: -3px; }

/* header */
.top { padding-block: 28px 18px; display: grid; gap: 8px; }
.top h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); text-transform: uppercase; }
.top p { margin: 0; max-width: 70ch; color: var(--muted); }
/* a quiet strip: league switch on the left, season on the right */
.topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 18px; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.leagues { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.leagues a { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); text-decoration: none; font-family: var(--display); font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; }
.leagues a:hover { color: var(--ink); }
.leagues a[aria-current="page"] { color: var(--ink); }
.leagues a img { height: 18px; width: auto; max-width: 30px; object-fit: contain; }
.leagues a:not([aria-current="page"]) img { filter: grayscale(1); opacity: 0.55; }
.leagues a:hover img { filter: none; opacity: 1; }
/* four leagues on one line down to a 320px phone */
@media (max-width: 380px) { .leagues { column-gap: 12px; } .leagues a { gap: 5px; letter-spacing: 0.04em; } }
/* the league's logo (and title sponsor's) leads the headline */
.titlerow { display: flex; align-items: center; gap: 16px; }
.lockup { display: flex; flex: none; align-items: center; gap: 10px; padding-right: 16px; border-right: 3px solid var(--ink); align-self: stretch; }
.lockup img { height: clamp(36px, 7vw, 56px); width: auto; object-fit: contain; }

/* picker */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; padding-block: 8px 20px; }
.pick { display: grid; justify-items: center; gap: 2px; padding: 10px 6px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: border-color .15s, transform .15s; }
.pick:hover { border-color: var(--muted); }
.pick[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 -3px 0 var(--team, var(--accent)); }
.pick img { width: 34px; height: 34px; object-fit: contain; }
.pick .ab { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.04em; }
.pick .rec { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
/* odds pill that fills in proportion to the odds */
.pick .odds { position: relative; width: 100%; max-width: 74px; height: 20px; margin-top: 4px; border-radius: 999px; background: var(--sunk); overflow: hidden; display: grid; place-items: center; }
.pick .odds i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); }
.pick .odds b { position: relative; font-size: 0.75rem; font-weight: 600; color: var(--bar-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pick .odds.hot b { color: var(--accent); }
.pick.out { opacity: 0.55; }
/* the league page's link to its gameday page */
/* the two views of a league: its teams' paths, and this week's games */
.modes { display: inline-flex; margin-left: auto; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.modes a { display: inline-flex; align-items: center; gap: 6px; padding: 3px 14px; color: var(--muted); text-decoration: none; font-family: var(--display); font-weight: 600; font-size: 0.92rem; text-transform: uppercase; letter-spacing: 0.06em; }
.modes a + a { border-left: 1px solid var(--line); }
.modes a:hover { color: var(--ink); }
.modes a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.modes .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loss); animation: calcpulse 1s ease-in-out infinite alternate; }
@media (prefers-reduced-motion: reduce) { .modes .dot { animation: none; } }

/* gameday page: how the race has moved this week, and the slate with what each game does to it */
.gd { display: grid; gap: 26px; padding-bottom: 10px; }
.gd h2 { font-size: 1.5rem; }
.gd-sec { display: grid; gap: 12px; }
.gd-sec > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; border-top: 3px solid var(--ink); padding-top: 14px; }
.gd-sec > header p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.race { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 10px; }
.race > button { display: grid; grid-template-columns: 20px auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 9px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); text-align: left; cursor: pointer; font-variant-numeric: tabular-nums; font-size: 0.88rem; }
.race > button:hover { border-color: var(--muted); }
.race > button.out { opacity: 0.55; }
.race > button[aria-pressed="true"] { opacity: 1; border-color: var(--ink); box-shadow: inset 3px 0 0 var(--team, var(--accent)); }
.race img { width: 20px; height: 20px; object-fit: contain; }
.race b { font-family: var(--display); font-weight: 700; letter-spacing: 0.04em; font-size: 0.98rem; }
.race .was { font-size: 0.78rem; color: var(--muted); font-weight: 400; }
.race .now { font-weight: 600; text-align: right; white-space: nowrap; }
.race .delta { min-width: 2.6em; text-align: right; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
/* phones: two to a row; the starting odds stay in the row's label */
@media (max-width: 640px) { .race { grid-template-columns: 1fr 1fr; gap: 5px 6px; } .race > button { gap: 6px; padding: 5px 7px; } .race .was { display: none; } }
/* the smallest phones: two to a row would run the name into the odds */
@media (max-width: 379px) { .race { grid-template-columns: minmax(0, 1fr); } .race .was { display: inline; } }
.delta.up { color: var(--win); }
.delta.down { color: var(--loss); }
.gd-none { margin: 0; color: var(--muted); }
/* in-game win probability */
.wp { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
.wp-lab { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.wp-lab b { color: var(--ink); font-weight: 600; }
.wp svg { display: block; width: 100%; height: 76px; border-block: 1px dotted var(--line); }
.wp .q { stroke: var(--line); stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
.wp .m { stroke: var(--muted); vector-effect: non-scaling-stroke; }
.wp .f { opacity: 0.3; }
.wp .l { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.wp-q { position: relative; height: 1.2em; font-size: 0.68rem; color: var(--muted); }
.wp-q span { position: absolute; transform: translateX(-50%); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.gc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 9px; align-content: start; min-width: 0; }
.gc.top { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
/* the team picked in the race: its games, and its row in every game it's moved by */
.gc.mine { border-color: var(--ink); box-shadow: inset 0 3px 0 var(--team, var(--accent)); }
.gc-stakes .me { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.gc-when { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; color: var(--muted); }
.gc-when .live { color: var(--loss); font-weight: 600; }
.gc-when .tag { background: var(--accent-soft); color: var(--accent); }
.gc-team { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-weight: 600; }
.gc-team img { width: 22px; height: 22px; object-fit: contain; }
.gc-team .r { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 0.85rem; color: var(--muted); }
.gc-team.won .r { color: var(--ink); font-weight: 700; }
.gc-team.lost { color: var(--muted); }
.gc-team.lost img { opacity: 0.6; }
.gc-line { font-size: 0.8rem; color: var(--muted); }
.gc-stakes { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 1px 0; font-size: 0.85rem; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); padding-top: 8px; }
.gc-stakes > span { padding: 1px 6px; }
.gc-stakes .h { font-family: var(--display); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); text-align: right; }
.gc-stakes .h:first-child { text-align: left; }
.gc-stakes .t { display: flex; align-items: center; gap: 5px; min-width: 0; }
.gc-stakes .t img { width: 15px; height: 15px; object-fit: contain; }
.gc-stakes .v { text-align: right; color: var(--muted); }
.gc-stakes .v.up { color: var(--win); font-weight: 600; }
.gc-quiet { margin: 0; border-top: 1px solid var(--line); padding-top: 8px; font-size: 0.82rem; color: var(--muted); }
.gc-links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; }
/* phones: the slate scrolls sideways, so the team view isn't pushed a screen further down */
@media (max-width: 640px) {
  .games { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: min(84%, 300px); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; }
  .gc { scroll-snap-align: start; }
}

.locks { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 16px; background: var(--warn-soft); color: var(--ink); border-radius: 10px; }
.locks button { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; }

/* team hero */
.hero { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding-block: 18px; border-top: 3px solid var(--ink); }
.hero img { width: 72px; height: 72px; object-fit: contain; }
.hero h2 { font-size: clamp(2rem, 5vw, 3rem); }
.hero .rec { color: var(--muted); }
.big { text-align: right; }
.big .pct { font-family: var(--display); font-weight: 700; font-size: clamp(2.8rem, 8vw, 4.4rem); line-height: 0.9; font-variant-numeric: tabular-nums; }
.big .lbl { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: var(--sunk); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.chip.good { background: var(--win-soft); color: var(--win); font-weight: 600; }
.chip.bad { background: var(--loss-soft); color: var(--loss); font-weight: 600; }
.chip.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }
/* align-content: start keeps contents at the top when a panel is stretched to match a taller sibling */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel > header { display: grid; gap: 4px; }
.panel > header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
/* most-likely-path summary: three small labeled stats instead of one long paragraph */
.path-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin: 6px 0 0; }
.path-stats > div { background: var(--sunk); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; align-content: start; }
.path-stats dt { font-family: var(--display); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.path-stats dd { margin: 0; font-weight: 600; font-size: 0.95rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.panel > header .path-note { font-size: 0.8rem; }
.panel > header .path-key { font-size: 0.8rem; margin-top: 4px; }

/* path */
.week { display: grid; gap: 6px; }
.week h3 { font-size: 0.85rem; color: var(--muted); }
.game { display: grid; grid-template-columns: 1fr auto 1fr 4.4em; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--sunk); font-size: 0.92rem; }
.game .side { display: flex; align-items: center; gap: 6px; min-width: 0; }
.game .side.home { justify-content: flex-end; }
.game img { width: 20px; height: 20px; object-fit: contain; flex: none; }
.game .w { font-weight: 600; }
.game .l { color: var(--muted); }
.game .l img { opacity: 0.6; }
details.minor { display: grid; gap: 10px; }
details.minor > summary { cursor: pointer; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 0.88rem; }
details.minor > summary:hover { color: var(--ink); border-color: var(--muted); }
details.minor[open] > summary { margin-bottom: 8px; }
details.minor .note { margin: 0 0 8px; }
details.minor .week + .week { margin-top: 10px; }
.wb { flex: none; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; background: var(--win); color: var(--surface); font-family: var(--display); font-weight: 700; font-size: 0.8rem; line-height: 1; }
.game .at { color: var(--muted); font-size: 0.8rem; }
.game.mine { box-shadow: inset 3px 0 0 var(--accent); }
/* odds column: same width on every row; only upsets are colored */
.game .po { display: grid; grid-template-columns: 1fr 1.2em; align-items: baseline; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.game .po .n { text-align: right; }
.game .po .x { padding-left: 3px; font-weight: 700; letter-spacing: -0.05em; }
.game .po.ups { color: var(--warn); font-weight: 600; }
.game .po.set .x { color: var(--ink); font-weight: 400; } /* class is "set", not "pick": .pick is the team-picker card */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tag { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tag.ups { background: var(--warn-soft); color: var(--warn); }

.ends { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.stand { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 2px 10px; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.stand .seed { font-family: var(--display); font-weight: 700; color: var(--accent); }
.stand .me { font-weight: 600; }
/* a tiebreak decision: sentence, then the deciding numbers */
.tb { display: grid; gap: 8px; font-size: 0.9rem; }
.tb-say, .tb-note { margin: 0; }
.tb-say b { font-weight: 600; }
.tb-step { font-family: var(--display); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); white-space: nowrap; }
.tb-note { font-size: 0.82rem; color: var(--muted); }
.tb-table { display: grid; grid-template-columns: 1fr auto; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-variant-numeric: tabular-nums; }
.tb-table > span { padding: 5px 10px; border-top: 1px solid var(--line); }
.tb-table > .h { border-top: 0; font-family: var(--display); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.tb-table > .v { text-align: right; }
.tb-table > .win { background: var(--accent-soft); font-weight: 600; }
.tb-table > .v.win { color: var(--accent); }
.tb-table > .out { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }

/* rooting guide */
.rg { display: grid; gap: 4px; }
.rg-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 160px; gap: 14px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.rg-row.flat { opacity: 0.5; }
.rg-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }

.rg-picks > .rg-row:last-child { border-bottom: 0; }

.root .who { font-weight: 600; }

.seg button { border: 0; background: transparent; padding: 5px 2px; cursor: pointer; font-weight: 600; font-family: var(--display); letter-spacing: 0.04em; font-size: 0.85rem; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

section.block > p { margin: 0; } /* the grid gap spaces them; default margins doubled it */

.note { font-size: 0.88rem; color: var(--muted); max-width: 75ch; }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const STEP_COL = { a: "Vs. tied teams", b: "Vs. common opponents", c: "Vs. next group", d: "Opponents' conf. win %", e: "Total wins", f: "FPI", ...TEXT.col };
const NUM_WORD = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];

// ACC 2026: a two-team tie's winner that then meets another tied team ("working downward")
const ladderWin = (tr, ex) => RULES.redefine && tr.winner != null && ex.trace.slice(ex.trace.indexOf(tr) + 1).some((x) => x.tied.includes(tr.winner));

// One tiebreak decision: a plain sentence, then the tied teams' deciding numbers, winner first.
function tiebreakHTML(tr, ex) {
  const st = ex.st, [s1, s2] = ex.seeds;
  const name = (t) => esc(T[t].short);
  const n = tr.tied.length;
  const who = n === 2 ? `${name(tr.tied[0])} and ${name(tr.tied[1])}` : `${NUM_WORD[n] ? NUM_WORD[n][0].toUpperCase() + NUM_WORD[n].slice(1) : n} teams`;
  const seed = tr.winner === s1 ? "the #1 seed" : tr.winner === s2 ? "the #2 seed" : "the tiebreak";
  const list = (ts) => ts.length === 2 ? `${name(ts[0])} and ${name(ts[1])}` : ts.slice(0, -1).map(name).join(", ") + ", and " + name(ts[ts.length - 1]);
  const names = (ts) => ts.length === 1 ? name(ts[0]) : list(ts);
  let how = STEP_ON[tr.step];
  if (!tr.rows && tr.step === "a") {
    const other = tr.tied.find((t) => t !== tr.winner);
    how = n === 2 ? `by beating ${name(other)}` : tr.cut ? "by losing to every other tied team" : "by beating every other tied team";
  }
  const listed = !tr.rows && n > 2 ? ` (${tr.tied.map(name).join(", ")})` : "";
  // a step that doesn't single out one team but leaves some behind: those teams drop out
  const cut = tr.cut || [];
  const kept = tr.tied.filter((t) => !cut.includes(t));
  // tr.spot: this decision only picks a title-game team; the two are seeded afterwards
  // Big Ten: three or more left level go on to the next step instead of starting over
  const nextStep = RULES.steps[RULES.steps.indexOf(tr.step) + 1];
  const goOn = RULES.cutContinues && kept.length > 2 && nextStep ? `go on to step ${stepName(nextStep)}` : "start over";
  const outcome = cut.length
    ? `${names(cut)} ${cut.length === 1 ? "drops" : "drop"} out ${how}, and ${names(kept)} ${goOn}.`
    : ladderWin(tr, ex) ? `<b>${name(tr.winner)}</b> wins this tie ${how}, and moves on.`
    : `<b>${name(tr.winner)}</b> gets ${tr.spot ? "a title-game spot" : seed} ${how}.`;
  // ACC 2026: tied teams can have different records (same wins or same losses, different schedules)
  const pairTie = (x, y) => {
    const [k, what] = st.CW[x] === st.CW[y] ? [st.CW[x], "win"] : [st.CL[x], "loss"];
    const games = (t) => NUM_WORD[st.CW[t] + st.CL[t]];
    return `count as tied: ${NUM_WORD[k] || k} ${what}${k === 1 ? "" : what === "win" ? "s" : "es"} each, over ${games(x)} and ${games(y)} conference games`;
  };
  const recs = [...new Set(tr.tied.map((t) => record(st, t)))];
  const at = recs.length === 1 ? `tied at ${recs[0]}`
    : n === 2 ? pairTie(tr.tied[0], tr.tied[1])
    : `tied (${tr.tied.map((t) => `${name(t)} ${record(st, t)}`).join(", ")})`;
  const whoRec = recs.length === 1 || n > 2 ? who + listed : `${name(tr.tied[0])} (${record(st, tr.tied[0])}) and ${name(tr.tied[1])} (${record(st, tr.tied[1])})`;
  const say = `<p class="tb-say">${whoRec} ${at}. ${outcome} <span class="tb-step">Step ${stepName(tr.step)}</span></p>`;
  if (!tr.rows) return `<div class="tb">${say}</div>`;
  const rows = tr.rows.slice().sort((a, b) => (b.t === tr.winner) - (a.t === tr.winner) || cut.includes(a.t) - cut.includes(b.t) || b.key - a.key);
  const col = tr.step === "c" && tr.against ? `Vs. ${tr.against.map((o) => esc(T[o].abbr)).join(", ")}` : STEP_COL[tr.step];
  const table = `<div class="tb-table" role="table">
    <span class="h" role="columnheader">Team</span><span class="h v" role="columnheader">${col}</span>
    ${rows.map((r) => { const c = r.t === tr.winner ? "win" : cut.includes(r.t) ? "out" : ""; return `<span class="${c}" role="cell">${name(r.t)}</span><span class="v ${c}" role="cell">${esc(r.text)}</span>`; }).join("")}
  </div>`;
  const note = tr.step === "b" && tr.against ? `<p class="tb-note">Common opponents: ${tr.against.map((o) => esc(T[o].short)).join(", ")}</p>` : "";
  return `<div class="tb">${say}${table}${note}</div>`;
}

function explainHTML(i, ex) {
  const st = ex.st, [s1, s2] = ex.seeds;
  // Within a group tied on record, the seeds the tiebreakers picked go first, in seed order.
  // The tiebreakers only decide the two title-game spots, so the others stay tied ("T3").
  const rows = [];
  let place = 1;
  for (const g of ex.groups) {
    const seeded = [s1, s2].filter((s) => g.includes(s));
    const rest = g.filter((t) => t !== s1 && t !== s2);
    for (const t of seeded) rows.push({ t, label: t === s1 ? "#1" : "#2" });
    const restPlace = place + seeded.length;
    for (const t of rest) rows.push({ t, label: (rest.length > 1 ? "T" : "") + restPlace });
    place += g.length;
  }
  const shown = rows.filter((r, k) => k < 7 || r.t === i);
  const stand = shown.map(({ t, label }) => `<span class="seed">${label}</span><span class="${t === i ? "me" : ""}">${esc(T[t].name)}</span><span>${record(st, t)}</span>`).join("");
  const top = ex.groups[0];
  const parts = [];
  if (!ex.trace.length) {
    parts.push(`<p class="tb-say">${top.length === 1 && ex.groups[1].length === 1 ? "No ties at the top. The standings decide it." : "No tiebreaker needed."}</p>`);
  }
  for (const tr of ex.trace) parts.push(tiebreakHTML(tr, ex));
  if (ex.trace.length === 1 && ex.trace[0].tied.length === 2 && [s1, s2].every((t) => ex.trace[0].tied.includes(t))) parts.push(`<p class="tb-note">Both teams tied for first make the title game; the tiebreak only sets who is #1.</p>`);
  return `<div class="ends"><h3>How the standings end</h3><div class="stand">${stand}</div>${parts.join("")}</div>`;
}

// The selected team's remaining games, and whether they're all locked as wins
function ownGames(team) { return P.map((g, k) => [g, k]).filter(([g]) => g.h === team || g.a === team); }
function winsOutLocked(team) {
  const own = ownGames(team);
  return own.length > 0 && own.every(([g, k]) => locks[k] === (g.h === team ? 1 : 0));
}
function winOutButton(team) {
  if (!ownGames(team).length) return "";
  const on = winsOutLocked(team);
  return `<button id="winOut" class="wo-btn" type="button" data-team="${team}" aria-pressed="${on}"${on ? ' title="Click to clear these picks"' : ""}>${on ? "&#10003; " + esc(T[team].short) + " wins out" : "What if " + esc(T[team].short) + " wins out?"}</button>`;
}

// Which games a team's path shows, and how often those shown results are enough.
// Shown: the team's own games, your picks, games that move its odds overall, and any other game
// this particular path depends on (flipping it knocks the team out, e.g. by tipping a
// strength-of-schedule tiebreak). Reliability: with the shown results fixed, the share of finishes
// of the remaining games (at ESPN's odds) that still put the team in. Cached with the analysis.
function pathDetails(i, A) {
  if (A.pathDetails) return A.pathDetails;
  // a guaranteed path shows exactly its results and the visitor's picks, and they're always enough
  if (A.need) {
    const isKey = (g, k) => locks[k] !== undefined || ((A.need.games >>> k) & 1) === 1;
    return (A.pathDetails = { isKey, dependsOn: new Set(), reliability: 1 });
  }
  const m = A.path.mask >>> 0;
  const base = (g, k) => A.imp.hits < 30 || g.h === i || g.a === i || locks[k] !== undefined || matters(A.imp.games[k]);
  const dependsOn = new Set();
  P.forEach((g, k) => { if (!base(g, k) && !B12.qualifies(ctx, (m ^ (1 << k)) >>> 0, i)) dependsOn.add(k); });
  const isKey = (g, k) => base(g, k) || dependsOn.has(k);
  const free = P.map((g, k) => k).filter((k) => !isKey(P[k], k));
  const out = Uint8Array.from(P, (g, k) => (m >>> k) & 1);
  let inW = 0, totW = 0;
  const score = (w) => { const s = B12.titleGame(B12.standings(ctx, out), () => 0.5); totW += w; if (s[0] === i || s[1] === i) inW += w; };
  if (free.length <= 16) {
    for (let f = 0; f < 2 ** free.length; f++) {
      let w = 1;
      free.forEach((k, b) => { const o = (f >>> b) & 1; out[k] = o; w *= o ? P[k].pHome : 1 - P[k].pHome; });
      score(w);
    }
  } else {
    let seed = 99;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    for (let n = 0; n < 20000; n++) { free.forEach((k) => { out[k] = rnd() < P[k].pHome ? 1 : 0; }); score(1); }
  }
  return (A.pathDetails = { isKey, dependsOn, reliability: totW ? inW / totW : 0 });
}

// Every conference game played: the standings are final, so no odds, paths or rooting guide.
let finalEx = null;
const finalSeeds = () => (finalEx ||= B12.explain(ctx, 0)).seeds;
function renderFinal(i) {
  const t = T[i], seeds = finalSeeds(), seed = seeds.indexOf(i) + 1;
  $("team").innerHTML = `
    <div class="hero" style="--team:${safeColor(t.color)}">
      ${logo(i)}
      <div><h2>${esc(t.name)}</h2><div class="rec num">${curW[i]}-${curL[i]} ${esc(LG.name)} · ${overall[i]} overall</div></div>
      <div class="big"><div class="pct">${seed ? "#" + seed : "Out"}</div><div class="lbl">${seed ? "seed in the title game" : "of the title game"}</div></div>
    </div>
    <div class="panel"><header><h3>Final standings</h3><p>Every conference game is played. ${seed
      ? `${esc(t.short)} is the #${seed} seed and plays ${esc(T[seeds[2 - seed]].short)} for the title.`
      : `${esc(T[seeds[0]].short)} and ${esc(T[seeds[1]].short)} play for the title.`}</p></header>
      ${explainHTML(i, finalEx)}
    </div>`;
}

function renderTeam() {
  heroSaved = null;
  if (!P.length) return renderFinal(sel);
  const i = sel, t = T[i];
  const A = teamAnalysis(i);
  const pIn = A.p;
  const facts = [];
  if (A.exact) {
    // every claim here is proven over all possible finishes
    if (A.clinched) facts.push(`<span class="chip good">Clinched a title-game spot</span>`);
    else if (A.eliminated) facts.push(`<span class="chip bad">Eliminated</span>`);
    else if (A.hasOwnGames && A.winOutGuaranteed) facts.push(`<span class="chip good">Win out and they're in</span>`);
    else if (A.hasOwnGames && A.pWinOut != null) facts.push(`<span class="chip ${A.pWinOut > 0.5 ? "warn" : "bad"}">Even winning out: ${A.pWinOut > 0 && A.pWinOut < 0.001 ? oneIn(A.pWinOut) : pct(A.pWinOut)}</span>`);
    if (pIn > 0 && pIn < 0.001) facts.push(`<span class="chip">Exact odds: ${oneIn(pIn)}</span>`);
  } else {
    // simulated: say so instead of claiming certainty
    if (pIn >= 1) facts.push(`<span class="chip good">In the title game in every simulation</span>`);
    else if (A.hasOwnGames && A.pWinOut >= 1) facts.push(`<span class="chip good">Win out: in every simulation</span>`);
    else if (A.hasOwnGames && A.path) facts.push(`<span class="chip ${A.pWinOut > 0.5 ? "warn" : "bad"}">Even winning out: ${A.pWinOut === 0 ? "&lt;0.1%" : pct(A.pWinOut)}</span>`);
    if (!A.path) facts.push(`<span class="chip bad">No path found in simulations</span>`);
  }
  facts.push(`<span class="chip">#1 seed: ${pct(A.first)}</span>`);
  facts.push(`<span class="chip">${remaining[i]} game${remaining[i] === 1 ? "" : "s"} left</span>`);
  if (A.approx) facts.push(`<span class="chip warn">Long shot: odds estimated with weighted sampling</span>`);

  let pathHTML;
  if (!A.path) {
    pathHTML = A.exact
      ? `<div class="panel"><header><h3>Eliminated</h3><p>None of the ${(2 ** P.length).toLocaleString("en-US")} possible combinations of the remaining results puts ${esc(t.short)} in the title game.</p></header></div>`
      : `<div class="panel"><header><h3>No path found</h3><p>None of ${(N_MAIN + 2 * N_EXPLORE + N_FORCED).toLocaleString("en-US")} simulated finishes${locks.some((l) => l !== undefined) ? " under your what-ifs" : ""}, including ones where ${esc(t.short)} wins every remaining game and the rest are coin flips, puts them in the title game. A very unlikely path may still exist; simulation can't prove it doesn't.</p></header></div>`;
  } else {
    const m = A.path.mask;
    const pd = pathDetails(i, A);
    const isKey = pd.isKey;
    // upsets among the results shown, not the games that don't matter
    const pathOdds = P.map((g, k) => (locks[k] !== undefined || !isKey(g, k) ? null : ((m >>> k) & 1) ? g.pHome : 1 - g.pHome));
    const upsets = pathOdds.filter((p) => p !== null && p < 0.5 - TOSS_UP).length;
    const tossUps = pathOdds.filter((p) => p !== null && p < 0.5 && isTossUp(p)).length; // toss-ups going to the slight underdog
    const count = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
    const needs = upsets === 0 && tossUps === 0 ? "No upsets"
      : upsets === 0 ? `${count(tossUps, "toss-up")} to the underdog`
      : tossUps === 0 ? count(upsets, "upset")
      : `${count(upsets, "upset")} + ${count(tossUps, "toss-up")}`;
    const weeks = [...new Set(P.map((g) => g.week))];
    const weekBlocks = (key) => weeks.map((w) => {
      const rows = P.map((g, k) => [g, k]).filter(([g, k]) => g.week === w && isKey(g, k) === key)
        .sort(([a], [b]) => (b.h === i || b.a === i) - (a.h === i || a.a === i))
        .map(([g, k]) => gameRow(g, k, ((m >>> k) & 1) === 1, g.h === i || g.a === i)).join("");
      return rows ? `<div class="week"><h3>Week ${w}</h3>${rows}</div>` : "";
    }).join("");
    const nMinor = P.filter((g, k) => !isKey(g, k)).length;
    // Odds of the results shown (the games that matter), not every remaining game: picks the
    // visitor set aren't chances, so they're left out of the product.
    const shown = P.map((g, k) => [g, k]).filter(([g, k]) => isKey(g, k) && locks[k] === undefined);
    const shownProb = shown.reduce((acc, [g, k]) => acc * (((m >>> k) & 1) ? g.pHome : 1 - g.pHome), 1);
    const nPicks = P.filter((g, k) => isKey(g, k) && locks[k] !== undefined).length;
    const oddsText = shownProb >= 0.1 ? pct(shownProb, 0) : oneIn(shownProb);
    const oddsLabel = shown.length === 1 ? (nPicks ? "Odds of the other result" : "Odds of this result")
      : `Odds of ${nPicks ? "the other" : "these"} ${shown.length} results`;
    // how often these shown results are enough, with the games not shown at ESPN's odds; shown
    // only to qualify a path that isn't guaranteed (long shots, or data without guaranteed paths)
    const sure = pd.reliability >= 0.9995;
    const enough = sure ? "Always in" : `${pd.reliability < 0.005 ? "Under 1%" : pct(pd.reliability, 0)} of the time`;
    const stat = (label, value) => `<div><dt>${label}</dt><dd>${value}</dd></div>`;
    const nothing = A.need && !shown.length; // clinched, or the picks alone are enough
    const stats = `<dl class="path-stats">
      ${stat("Needs", nothing ? (nPicks ? "Just your picks" : "Nothing more") : needs)}
      ${shown.length ? stat(oddsLabel, oddsText) : ""}
      ${shown.length && !A.need && !sure ? stat(shown.length === 1 ? "If it happens" : "If they happen", enough) : ""}
    </dl>${shown.length && !sure ? `<p class="path-note">The rest comes down to games not shown.</p>` : ""}${A.need && A.need.checks && shown.length ? `<p class="path-note">Checked against ${A.need.checks.toLocaleString("en-US")} simulated finishes with these results, not every possible one.</p>` : ""}`;
    const minorHead = A.need
      ? `<summary>${nMinor} other game${nMinor > 1 ? "s" : ""} ${nMinor > 1 ? "don't" : "doesn't"} matter${shown.length + nPicks === 1 ? " if this happens" : shown.length + nPicks ? " if these happen" : ""}</summary>
      <p class="note">${esc(t.short)} is in whichever way ${nMinor > 1 ? "they go" : "it goes"}. Shown with the favorite winning.</p>`
      : `<summary>${nMinor} other game${nMinor > 1 ? "s" : ""} barely matter to ${esc(t.short)}</summary>
      <p class="note">Either result barely changes their overall odds. In a scenario that comes down to a deep tiebreaker, one of these can still tip strength of schedule.</p>`;
    const body = weekBlocks(true) + (nMinor ? `<details class="minor" id="path-minor"${openState["path-minor"] ? " open" : ""}>
      ${minorHead}${weekBlocks(false)}</details>` : "");
    const lead = A.need
      ? `${A.need.exact ? "The single likeliest set of results" : "The likeliest set of results the simulations found"} that guarantees ${esc(t.short)} a title-game spot, whatever happens in the other games.`
      : `${A.exact ? "The single likeliest set of results" : "The likeliest set of results the simulations found"} that puts ${esc(t.short)} in the title game.`;
    pathHTML = `<div class="panel">
      <header><h3>Most likely path</h3>
      <p>${lead}</p>
      ${stats}
      <p class="path-key"><span class="wb">W</span> marks the winner. Percentages are ESPN's odds of that result.</p></header>
      ${body}
      ${explainHTML(i, A.ex)}
    </div>`;
  }

  // rooting guide
  const rows = P.map((g, k) => ({ g, k, c: A.imp.games[k] }))
    .map((r) => ({ ...r, swing: r.c.pH == null || r.c.pA == null ? 0 : Math.abs(r.c.pH - r.c.pA) }))
    .sort((a, b) => b.swing - a.swing);
  const rgRow = ({ g, k, c, swing, inWeek }) => { // inWeek: under a week heading already
    const own = g.h === i || g.a === i;
    const locked = locks[k] !== undefined;
    let root = "";
    // a locked result is shown by the check on its pressed button, inside the "Your picks" box
    if (locked) root = "";
    else if (c.pH == null || c.pA == null) root = `<span class="muted">Not enough data</span>`;
    else if (swing < 0.005 && !matters(c)) root = `<span class="muted">Doesn't matter</span>`;
    else {
      const homeBetter = c.pH > c.pA;
      const who = homeBetter ? g.h : g.a;
      const hi = Math.max(c.pH, c.pA), lo = Math.min(c.pH, c.pA);
      // only claimed when proven over every finish
      const must = A.exact && (homeBetter ? c.needH : c.needA) ? ` <span class="tag ups" title="No finish gets them in without this result">Must</span>` : "";
      root = `<span><span class="who">Root for ${esc(T[who].short)}</span>${must}</span>
        <span class="bar"><i style="left:${lo * 100}%;width:${Math.max((hi - lo) * 100, 1)}%"></i></span>`;
    }
    const L = locks[k];
    // the selected team's title-game odds under each result, shown under that result's button
    // with the team's logo, so they don't read as the game's win chances
    const known = !locked && c.pH != null && c.pA != null;
    const mark = logo(i) || `<span class="abbr">${esc(t.abbr)}</span>`;
    const chip = (p, better) => known ? `<span class="rg-odds${better ? " up" : ""}" title="${esc(t.short)}'s odds of reaching the title game">${mark}${pct(p)}</span>` : "<span></span>";
    const odds = (p) => known ? ` data-odds="${pct(p)}"` : "";
    const awayFav = g.pHome < 0.5;
    // the selected team's own games: its logo in front of its name, nothing else
    const side = (x) => (x === i && logo(i) ? `<span class="me">${logo(i)}</span>` : "") + esc(T[x].abbr);
    return `<div class="rg-row${!locked && swing < 0.005 && !matters(c) ? " flat" : ""}">
      <div class="m"><span class="t">${side(g.a)} at ${side(g.h)}</span><span class="s">${inWeek ? "" : `Week ${g.week} · `}ESPN: ${esc(T[awayFav ? g.a : g.h].abbr)} ${pct(awayFav ? 1 - g.pHome : g.pHome, 0)}</span></div>
      <div class="root">${root}</div>
      <div class="rg-pick"><div class="seg" role="group" aria-label="What if: ${esc(T[g.a].abbr)} at ${esc(T[g.h].abbr)}">
        <button data-k="${k}" data-v="0" aria-pressed="${L === 0}" title="${esc(T[g.a].short)} wins"${odds(c.pA)} data-if="${esc(T[g.a].short)}">${L === 0 ? "&#10003; " : ""}${esc(T[g.a].abbr)}</button>
        <button class="auto" data-k="${k}" data-v="" aria-pressed="${L === undefined}" title="Use ESPN odds">–</button>
        <button data-k="${k}" data-v="1" aria-pressed="${L === 1}" title="${esc(T[g.h].short)} wins"${odds(c.pH)} data-if="${esc(T[g.h].short)}">${L === 1 ? "&#10003; " : ""}${esc(T[g.h].abbr)}</button>
      </div>${known ? `<div class="rg-under">${chip(c.pA, c.pA > c.pH + 0.0005)}<span></span>${chip(c.pH, c.pH > c.pA + 0.0005)}</div>` : ""}</div></div>`;
  };
  // results the visitor locked in stay pinned at the top, in their own box with the clear button
  const picked = rows.filter((r) => locks[r.k] !== undefined);
  const open = rows.filter((r) => locks[r.k] === undefined);
  const picks = picked.length ? `<div class="rg-picks">
    <div class="rg-picks-head"><span>Your picks (${picked.length})</span><button id="clearLocks" type="button">Clear all</button></div>
    ${picked.map(rgRow).join("")}
  </div>` : "";
  const keyRow = (r) => A.imp.hits < 30 || r.g.h === i || r.g.a === i || matters(r.c);
  const minorRows = open.filter((r) => !keyRow(r));
  // by week: the same rows under week headings, biggest swing first within each week
  const listRows = (rs) => rgSort !== "week" ? rs.map(rgRow).join("")
    : [...new Set(rs.map((r) => r.g.week))].sort((a, b) => a - b)
      .map((w) => `<div class="rg-week"><h4>Week ${w}</h4>${rs.filter((r) => r.g.week === w).map((r) => rgRow({ ...r, inWeek: true })).join("")}</div>`).join("");
  const rg = picks + listRows(open.filter(keyRow)) + (minorRows.length ? `<details class="minor" id="rg-minor"${openState["rg-minor"] ? " open" : ""}>
    <summary>${minorRows.length} game${minorRows.length > 1 ? "s" : ""} that barely matter</summary>${listRows(minorRows)}</details>` : "");
  const sortBtn = (v, label) => `<button type="button" data-sort="${v}" aria-pressed="${rgSort === v}">${label}</button>`;
  const sortCtl = `<div class="rg-sort" role="group" aria-label="Order games">${sortBtn("swing", "Biggest swing")}${sortBtn("week", "By week")}</div>`;

  $("team").innerHTML = `
    <div class="hero" style="--team:${safeColor(t.color)}">
      ${logo(i)}
      <div><h2>${esc(t.name)}</h2><div class="rec num">${curW[i]}-${curL[i]} ${esc(LG.name)} · ${overall[i]} overall</div></div>
      <div class="big"><div class="pct" id="heroPct">${pIn === 0 && A.path ? "&lt;0.1%" : pct(pIn)}</div><div class="lbl" id="heroLbl">to reach the title game</div></div>
    </div>
    <div class="facts">${facts.join("")}</div>
    <div class="cols">
      ${pathHTML}
      <div class="panel">
        <header><h3>Who to root for</h3><p>The games that move ${esc(t.short)}'s odds, ${rgSort === "week" ? "week by week" : "biggest first"}. Use the buttons to lock in a result and see what changes.</p></header>
        <div class="rg-tools">${winOutButton(i)}${sortCtl}</div>
        <div class="rg">${rg}</div>
      </div>
    </div>`;
}

function renderAll() {
  renderPicker(); renderLocks(); renderTeam();
}

// The link carries the view so it can be shared: "#tcu&picks=401752890h.401752891a&sort=swing".
// The team comes first (old "#tcu" links still work); each pick is ESPN's game id plus h or a for
// the side that wins, so picks survive data updates and drop out once their game is played.
function parseHash() {
  const out = { team: -1, locks: null, sort: null };
  const parts = location.hash.slice(1).toLowerCase().split("&");
  // a link cut short mid-escape ("#utah%") must not take the page down: it just names no team
  let name = parts[0] || "";
  try { name = decodeURIComponent(name); } catch (e) { name = ""; }
  out.team = T.findIndex((t) => t.abbr.toLowerCase() === name);
  for (const part of parts.slice(1)) {
    const [key, val = ""] = part.split("=");
    if (key === "picks") {
      out.locks = new Array(P.length).fill(undefined);
      for (const pk of val.split(".")) {
        const m = /^(.+)([ha])$/.exec(pk);
        const k = m ? P.findIndex((g) => String(g.id).toLowerCase() === m[1]) : -1;
        if (k >= 0) out.locks[k] = m[2] === "h" ? 1 : 0;
      }
    } else if (key === "sort" && (val === "week" || val === "swing")) out.sort = val;
  }
  return out;
}
function hashFor() {
  let h = "#" + T[sel].abbr.toLowerCase();
  const picks = P.map((g, k) => (locks[k] === undefined ? "" : g.id + (locks[k] ? "h" : "a"))).filter(Boolean);
  if (picks.length) h += "&picks=" + picks.join(".");
  if (rgSort !== "week") h += "&sort=" + rgSort;
  return h;
}
function writeHash() {
  const h = hashFor();
  if (location.hash === h) return;
  try { history.replaceState(null, "", h); } catch (e) { location.hash = h; }
}

// Responsiveness (INP): a click changes the state, the button and the link at once and returns.
// Whatever the new view needs is computed after that (in the worker), and the view is rendered
// when it is all in. Meanwhile the stale view is dimmed, a status line says what is running, and
// a single new pick shows estimated odds straight away (see estimate).

// The worker: engine.js (already on the page) plus workerMain, as a blob. Pages that can't start
// one (or a worker that fails) compute here instead, after the click's frame is painted.
function workerMain() {
  let wctx = null;
  const sims = new Map(); // key -> mainSims, the last few
  const simsFor = (key, lk) => {
    let s = sims.get(key);
    if (s) sims.delete(key);
    else s = B12.mainSims(wctx, lk);
    sims.set(key, s);
    if (sims.size > 3) sims.delete(sims.keys().next().value);
    return s;
  };
  self.onmessage = (e) => {
    const m = e.data;
    if (m.type === "init") { wctx = B12.build(m.data); return; }
    try {
      const s = simsFor(m.key, m.locks);
      self.postMessage({ id: m.id, out: m.kind === "totals" ? B12.totals(wctx, s) : B12.analyze(wctx, s, m.team, m.locks) });
    } catch (err) {
      self.postMessage({ id: m.id, error: String((err && err.message) || err) });
    }
  };
}
let worker = null, inFlight = null, jobSeq = 0;
function startWorker() {
  if (typeof Worker !== "function" || typeof Blob !== "function" || typeof URL === "undefined" || !document.scripts) return;
  const src = [...document.scripts].find((x) => !x.src && x.textContent.includes("root.B12 = api"));
  if (!src) return;
  try {
    const url = URL.createObjectURL(new Blob([src.textContent, "\n;(" + workerMain + ")();\n"], { type: "text/javascript" }));
    worker = new Worker(url);
    worker.onmessage = onResult;
    worker.onerror = (e) => { if (e && e.preventDefault) e.preventDefault(); workerFailed(); };
    worker.postMessage({ type: "init", data: DATA });
  } catch (e) { worker = null; }
}
function workerFailed() {
  if (worker) worker.terminate();
  worker = null; inFlight = null;
  refresh();
}
// The one thing the current view still needs, most urgent first; null when it has everything.
function nextJob() {
  if (exactMode()) return null;
  const key = lockKey();
  if (!totals.has(key)) return { kind: "totals", key, locks: locks.slice() };
  if (sel != null && !analyses.has(sel + ":" + key)) return { kind: "team", key, locks: locks.slice(), team: sel };
  return null;
}
function store(job, out) {
  if (job.kind === "totals") totals.set(job.key, out);
  else analyses.set(job.team + ":" + job.key, out);
  remember(job.key);
}
// one job at a time: the next is chosen when it is done, so it is always for the latest view (a job
// for a view already left still finishes, and is kept in case the visitor comes back to it)
function pump() {
  if (!worker || inFlight) return;
  const job = nextJob();
  if (!job) return;
  inFlight = { ...job, id: ++jobSeq };
  worker.postMessage(inFlight);
}
function onResult(e) {
  const job = inFlight;
  if (!job || e.data.id !== job.id) return;
  inFlight = null;
  if (e.data.error) return workerFailed();
  store(job, e.data.out);
  settle();
}
// without a worker: same jobs, on this thread
const simsHere = new Map();
function runHere(job) {
  let s = simsHere.get(job.key);
  if (!s) { simsHere.clear(); s = B12.mainSims(ctx, job.locks); simsHere.set(job.key, s); }
  store(job, job.kind === "totals" ? B12.totals(ctx, s) : B12.analyze(ctx, s, job.team, job.locks));
}

let shownKey = null;    // the what-ifs the rendered view was computed for
let pendingHere = false; // a no-worker compute is waiting for the next frame
// no team named in the link: the leader, once the odds to break its ties are in
function pickDefault() {
  if (sel == null && (exactMode() || totals.has(lockKey()))) sel = defaultTeam();
}
function refresh() {
  pickDefault();
  if (ready()) return settle();
  showPending();
  if (worker) return pump();
  if (typeof requestAnimationFrame !== "function") { for (let j; (j = nextJob());) runHere(j); return settle(); }
  if (pendingHere) return;
  pendingHere = true;
  // a timeout set in rAF runs after the paint, so the click's own frame shows first
  requestAnimationFrame(() => setTimeout(() => {
    pendingHere = false;
    for (let j; (j = nextJob());) runHere(j);
    settle();
  }));
}
// Render the view if everything for it is in; otherwise keep waiting (and keep the worker busy).
function settle() {
  pickDefault();
  if (!ready()) { showPending(); return pump(); }
  estimate = null;
  const key = exactMode() ? "exact" : lockKey(), picksChanged = shownKey !== null && key !== shownKey;
  shownKey = key;
  shownSel = sel;
  renderAll();
  setBusy(false);
  setStatus("");
  if (picksChanged) announce(); // screen readers hear the new odds once they're in
  if (firstRender) {
    // tidy a shared link: an unknown team becomes the one shown, picks for games played since drop out
    if (location.hash) writeHash();
    firstRender(); firstRender = null;
  }
}
let firstRender;
const rendered = new Promise((r) => { firstRender = r; });

// The estimate: exactly one more result picked than the shown view. From exact odds (no what-ifs
// yet) it is each team's exact odds given that result, which the exact data carries for the
// rooting guide; after that, the shown run's runs where that game already went that way (only
// from a decent sample; otherwise the picker just waits). Either way it is marked as an estimate:
// the full view that replaces it is simulated.
function makeEstimate() {
  const key = lockKey();
  if (totals.has(key) || (estimate && estimate.key === key)) return;
  estimate = null;
  const fromExact = shownKey === "exact";
  const base = fromExact ? null : shownKey ? totals.get(shownKey) : null;
  if (!fromExact && (!base || !base.cond)) return;
  const wasKey = fromExact ? ".".repeat(P.length) : shownKey;
  let k = -1;
  for (let j = 0; j < P.length; j++) {
    const was = wasKey[j], now = locks[j] === undefined ? "." : String(locks[j]);
    if (was === now) continue;
    if (was !== "." || k >= 0) return; // a pick undone, or more than one new pick
    k = j;
  }
  if (k < 0) return;
  if (fromExact) {
    const g = EX.teams.map((t) => t.games && t.games[k]);
    if (g.some((x) => !x || x.pH == null || x.pA == null)) return; // older exact data
    estimate = { key, nSims: 1, appear: g.map((x) => (locks[k] ? x.pH : x.pA)), first: null };
    return;
  }
  const c = k * 2 + locks[k], n = base.cond.n[c], N = T.length;
  if (n < 2000) return;
  estimate = { key, nSims: n, appear: Array.from(base.cond.appear.slice(c * N, c * N + N)), first: Array.from(base.cond.first.slice(c * N, c * N + N)) };
}
// What the visitor sees while waiting. Nothing moves: the picker's pills and the big number take
// estimated values in place (same widths), the rest of the view dims, and the status line (its
// space always kept) says what is running.
function showPending() {
  makeEstimate();
  const est = estimate && estimate.key === lockKey();
  if (est) {
    renderPicker();
    const pctEl = document.getElementById("heroPct");
    if (pctEl && sel === shownSel) { pctEl.innerHTML = pct(odds(sel).p); if (pctEl.classList) pctEl.classList.add("est"); heroSaved = null; }
  }
  setBusy(true, est);
  const key = lockKey();
  setStatus(exactMode() ? "" : !totals.has(key)
    ? (est ? "Estimate shown, refining…" : `Simulating ${N_MAIN.toLocaleString("en-US")} seasons…`)
    : `Finding ${sel == null ? "the leader" : T[sel].short}'s likeliest path…`);
}
let shownSel = null; // the team the rendered view is about
function setBusy(on, pickerFresh) {
  for (const id of ["picker", "team"]) {
    const el = $(id);
    if (!el.setAttribute) continue;
    if (on && !(id === "picker" && pickerFresh)) el.setAttribute("aria-busy", "true");
    else el.removeAttribute("aria-busy");
  }
}
function setStatus(msg) {
  const el = $("calc");
  el.textContent = msg;
  if (el.classList) el.classList.toggle("on", !!msg);
}
// A pick re-renders the big number out of a screen reader's sight: read the new odds out politely.
function announce() {
  if (!P.length) return;
  const A = teamAnalysis(sel); // cached by the render just done
  const n = locks.filter((l) => l !== undefined).length;
  const shown = (A.p === 0 && A.path ? "&lt;0.1%" : pct(A.p)).replace("&lt;", "<");
  $("announce").textContent = `${T[sel].short}: ${shown} to reach the title game, ${n ? `with ${n} result${n > 1 ? "s" : ""} set by you` : "with no results set"}.`;
}
// the pressed look for a button in a group, ahead of the full re-render
function press(btn, group) {
  const box = btn.closest && btn.closest(group);
  if (box) for (const b of box.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b === btn));
}

function select(i, push) {
  sel = i;
  if (push) writeHash();
  refresh();
}

document.addEventListener("click", (e) => {
  const rt = e.target.closest("[data-rt]");
  if (rt) { focusTeam = focusTeam === +rt.dataset.rt ? null : +rt.dataset.rt; renderGameday(); return; }
  const pick = e.target.closest("[data-t]");
  if (pick) { press(pick, ".picker"); select(+pick.dataset.t, true); return; }
  const seg = e.target.closest(".seg button");
  if (seg) {
    const k = +seg.dataset.k, v = seg.dataset.v;
    locks[k] = v === "" ? undefined : +v;
    press(seg, ".seg");
    writeHash(); refresh();
    return;
  }
  const sort = e.target.closest(".rg-sort button");
  if (sort) {
    rgSort = sort.dataset.sort;
    try { localStorage.setItem("rgSort", rgSort); } catch (e) {}
    // through refresh, not straight to renderTeam: a pick's recompute may still be queued, and
    // rendering before it would cache this team's analysis against the old simulations
    press(sort, ".rg-sort"); writeHash(); refresh();
    return;
  }
  if (e.target.id === "clearLocks") { locks = new Array(P.length).fill(undefined); writeHash(); refresh(); return; }
  const wo = e.target.closest("#winOut");
  if (wo) {
    // set (or undo) every remaining game of this team as a win; other picks are left alone
    const team = +wo.dataset.team, on = winsOutLocked(team);
    for (const [g, k] of ownGames(team)) locks[k] = on ? undefined : g.h === team ? 1 : 0;
    wo.setAttribute && wo.setAttribute("aria-pressed", String(!on));
    writeHash(); refresh();
  }
});
// hovering a result, or tabbing to it, previews the selected team's odds under it in the big number
const ODDS_BTN = ".seg button[data-odds]";
function preview(b) {
  const pctEl = document.getElementById("heroPct"), lbl = document.getElementById("heroLbl");
  if (!pctEl || !lbl) return;
  if (b) {
    if (!heroSaved) heroSaved = [pctEl.innerHTML, lbl.textContent];
    pctEl.textContent = b.dataset.odds;
    lbl.textContent = "if " + b.dataset.if + " wins";
  } else if (heroSaved) {
    [pctEl.innerHTML, lbl.textContent] = heroSaved;
    heroSaved = null;
  }
}
const oddsBtn = (el) => (el && el.closest ? el.closest(ODDS_BTN) : null);
document.addEventListener("mouseover", (e) => preview(oddsBtn(e.target)));
document.addEventListener("focusin", (e) => preview(oddsBtn(e.target)));
// leaving for another result is handled by its focusin; leaving the page or the buttons restores
document.addEventListener("focusout", (e) => { if (!oddsBtn(e.relatedTarget)) preview(null); });
// a link pasted into the address bar of an open page: take everything it sets
window.addEventListener("hashchange", () => {
  if (location.hash === hashFor()) return;
  const h = parseHash();
  if (h.team >= 0) sel = h.team;
  if (h.sort) rgSort = h.sort;
  const next = h.locks || new Array(P.length).fill(undefined);
  locks = next;
  // tidy what it couldn't use (an unknown team like "#zzz", stale picks) out of the address bar
  writeHash();
  refresh();
});

// open on the conference leader: best conference win percentage, ties broken by title-game odds
function defaultTeam() {
  const pctOf = (k) => (curW[k] + curL[k] ? curW[k] / (curW[k] + curL[k]) : 0);
  return T.map((_, k) => k).sort((a, b) => pctOf(b) - pctOf(a) || odds(b).p - odds(a).p)[0];
}

// boot
(function () {
  const fetched = new Date(DATA.fetchedAt);
  const lastDone = DATA.games.filter((g) => g.completed && g.conf).map((g) => g.date).sort().pop();
  renderHeader();
  renderRules();
  const through = new Date(lastDone).toLocaleDateString("en-US", { month: "long", day: "numeric" });
  if (!P.length) {
    $("lede").textContent = `Final standings: every ${LG.name} game is played, the last on ${through}. Pick a team to see where it finished and how the tiebreakers set the title game.`;
    $("method").hidden = true;
  } else $("lede").textContent = `Results through ${through} with ${P.length} ${P.length === 1 ? "game" : "games"} left. Pick a team to see its likeliest way into the title game and who to root for.`;
  $("methodText").textContent = EX
    ? `With ${P.length} games left there are ${(2 ** P.length).toLocaleString("en-US")} possible finishes. Every one is weighted by ESPN's Matchup Predictor odds and sorted by the official ${LG.name} tiebreakers, so the odds here are exact for those inputs.`
    : `Each of the ${P.length} remaining games is played out ${N_MAIN.toLocaleString("en-US")} times using ESPN's Matchup Predictor odds, and every simulated finish is sorted by the official ${LG.name} tiebreakers. Simulated odds are typically within half a point of exact.`;
  $("caveat").textContent = EX
    ? "These odds are only as good as ESPN's game predictions, which update about once a day. They treat each game as independent; with this little season left, that moves them by about a point at most."
    : "These odds are only as good as ESPN's game predictions, which update about once a day. They also treat each game as independent, which can make them a bit too confident with much of the season left.";
  const when = (s) => new Date(s).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const meta = DATA.meta || {};
  $("foot").innerHTML = `<div><b>Data last changed ${when(DATA.fetchedAt)}</b>${meta.checkedAt ? `, last checked ${when(meta.checkedAt)}` : ""}.${meta.nextResultCheck ? ` The next result can't land before ${when(meta.nextResultCheck)} (kickoff + 3 hours); until then only ESPN's odds can move.` : ""} Times are in your time zone.</div>
  <div>Sources, all from ESPN: results and schedules (<code>site.api.espn.com/…/scoreboard?groups=${LG.group}&amp;week=N</code>), Matchup Predictor win odds (<code>sports.core.api.espn.com/…/competitions/{id}/predictor</code>) and FPI (<code>…/seasons/{year}/powerindex</code>). A scheduled job fetches them and everyone shares the copy; your browser never calls ESPN.</div>
  ${DATA.exact && DATA.exact.skipped ? `<div>Exact odds were skipped for this data: ${esc(DATA.exact.skipped)}. The odds shown are from ${N_MAIN.toLocaleString("en-US")} simulations, typically within half a point.</div>` : ""}
  <div>Tiebreakers: <a href="${TEXT.policy.url}" target="_blank" rel="noopener">${TEXT.policy.title}</a>. Not affiliated with the ${esc(LG.name)} or ESPN.</div>`;
  if (GAMEDAY) {
    for (const id of ["picker", "locks", "team", "method", "rules"]) $(id).hidden = true;
    $("gameday").hidden = false;
    // a simulated league without its precomputed view: run the no-what-ifs simulation here, once
    if (!EX && !totals.has(baseKey) && P.length) totals.set(baseKey, B12.totals(ctx, B12.mainSims(ctx, locks)));
    renderGameday();
    firstRender(); firstRender = null;
    return;
  }
  const h = parseHash();
  if (h.locks) locks = h.locks;
  if (h.sort) rgSort = h.sort; // for this view only; the visitor's own choice stays saved
  sel = h.team >= 0 ? h.team : null; // none named: the leader, once its odds are in (settle)
  startWorker();
  refresh();
})();
return rendered;
}

// Show the page once it is whole: rendered, and its fonts in (swapping a font in later reflows the
// text). The font wait is capped so a slow font server can't hold the page back.
function reveal() {
  const fonts = document.fonts ? document.fonts.ready : null;
  const show = () => document.getElementById("page").removeAttribute("aria-busy");
  Promise.race([fonts, new Promise((r) => setTimeout(r, 500))].filter(Boolean)).then(show, show);
}
// app() resolves once the first view is rendered (simulated odds may still be computing); the
// page shows by then, or after 10 s in case the computing never comes back.
const firstView = (rendered) => Promise.race([rendered, new Promise((r) => setTimeout(r, 10000))]);
if (EMBEDDED) Promise.resolve().then(() => firstView(app(EMBEDDED))).finally(reveal);
else fetch("page-data.json", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((d) => firstView(app(d)))
  .catch((e) => { document.getElementById("lede").textContent = `Couldn't load the standings data (${e.message}). Reload the page to try again.`; })
  .finally(reveal);
</script>
